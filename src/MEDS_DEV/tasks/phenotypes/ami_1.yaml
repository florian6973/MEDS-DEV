# ami_1 -- the reAIM-Lab **ATLAS** AMI cohort: at-risk (ischemic-heart-disease / differential dx) ->
# 1-year **incident AMI during an inpatient/ER encounter**. Visit-anchored, first-AMI. Declarative
# ACES; requires the `interval_logic` fork (for `during`). (ami_2 is the operational, discharge-
# anchored cohort_extract definition -- a different cohort; see README.md.)
#
# To adapt to a dataset: resolve each `???` base predicate into that build's codes and put them in
# predicates/<DATASET>/ami_1_<scheme>.yaml (see README.md). The task needs the MEDS to emit visit
# start+end and observation_period start+end; if the build lacks them, drop the encounter / depth /
# cohort-end windows.

predicates:
  ami: "???"                 # Acute-MI diagnosis (Case CS3)
  ip_er_start: "???"         # inpatient/ER admission (Case CS2) start
  ip_er_end: "???"           # inpatient/ER discharge (Case CS2) end
  any_visit: "???"           # any visit start (the trigger universe)
  risk_entry: "???"          # at-risk inclusion: differential (CS1) U ischemic-heart-disease (CS3) U GloVe-related (CS4)
  obs_period_start: "???"    # observation_period start
  obs_period_end: "???"      # observation_period end
  condition_or_drug: "???"   # any condition/drug event (recent-activity gate)

  ami_encounter:             # an AMI occurring DURING an inpatient/ER stay
    during: { event: ami, opens: ip_er_start, closes: ip_er_end, closed: both }
  visit_in_obs:              # a visit inside an observation period
    during: { event: any_visit, opens: obs_period_start, closes: obs_period_end, closed: left }

trigger: visit_in_obs        # every visit, restricted to inside an observation period (cohort-end bound)

windows:
  at_risk_entry:             # entered the at-risk cohort
    start: null
    end: trigger
    start_inclusive: True
    end_inclusive: True
    index_timestamp: end
    has: { risk_entry: (1, None) }

  no_prior_ami:              # no prior encounter-AMI before the trigger
    start: null
    end: trigger
    start_inclusive: True
    end_inclusive: False
    has: { ami_encounter: (None, 0) }

  sufficient_history:        # >=2yr of observation before the trigger
    start: null
    end: trigger - 730d
    start_inclusive: True
    end_inclusive: True
    has: { obs_period_start: (1, None) }

  recent_activity:           # >=1 condition/drug in the prior 2yr
    start: end - 730d
    end: trigger
    start_inclusive: True
    end_inclusive: True
    has: { condition_or_drug: (1, None) }

  target:                    # encounter-AMI within the next year
    start: trigger
    end: start + 365d
    start_inclusive: False
    end_inclusive: True
    label: ami_encounter

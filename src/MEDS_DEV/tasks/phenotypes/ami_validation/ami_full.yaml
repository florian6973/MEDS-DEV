# AMI at-risk -> 1-year AMI, FULL benchmark fidelity (reAIM-Lab ehr_foundation_model_benchmark).
#
# This is the validated full-benchmark task: it reproduces the published cohort declaratively, using
# three relational/disjunctive constructs from the ACES `interval_logic` fork
# (https://github.com/florian6973/ACES/tree/interval_logic) -- `during`, `within`, `has_any`. See
# ../AMI_TASK_REPORT.md ("Full-benchmark validation") and ../aces_relational_predicates_spec.md.
#
# Validated ACES == reproduce_meds.py = 0/0 at every rung; residual vs the live OMOP cohort is
# ~0.066% $H<->MEDS ETL drift (AMI concept remap + unmapped concept_id 0 drops). REQUIRES the fork
# (and meds>=0.4). The mainline-compatible, approximation task is ../ami.yaml.
#
# Stale-on-CUMC constraints are intentionally OMITTED: the CS0 7-day entry exclusion (0 effect --
# acute-MI concepts are a subset of CS3, so an acute MI IS the entry) and the obs-period membership
# window (0 effect -- implied by the obs-start depth gate). The smoking arm of #6 is kept for
# fidelity but is a dead branch on a condition-only stream.
#
# Base predicates are `???` -- supply per dataset (see predicates/<DATASET>/ami_full.yaml).

predicates:
  # --- base (dataset-specific; override in predicates/<DATASET>/ami_full.yaml) ---
  ami: "???"                 # Acute-MI (Case CS3) start
  ip_er_start: "???"         # inpatient/ER admission (Case CS2) start
  ip_er_end: "???"           # inpatient/ER discharge (Case CS2) end
  any_visit: "???"           # any visit start (the trigger universe)
  cs13: "???"                # at-risk direct: differential (CS1) U ischemic heart disease (CS3) start
  cs4: "???"                 # at-risk embedding set (CS4) start
  smoking: "???"             # smoking-status concepts (the #6 corroboration)
  obs_period_start: "???"    # observation_period start
  obs_period_end: "???"      # observation_period end
  # WIDENED recent-activity predicate: R0 counts ANY condition_occurrence/drug_exposure; match that
  # breadth (condition-eras + interval-ends), not just standard-vocab //start. See the drift ledger.
  condition_or_drug: "???"

  # --- relational / derived (fork constructs; dataset-independent) ---
  ami_encounter:             # #2: an AMI occurring DURING an inpatient/ER stay
    during: { event: ami, opens: ip_er_start, closes: ip_er_end, closed: both }
  cs4_smk:                   # #6: a CS4 corroborated by a smoking event (one-sided window disabled -> wide)
    within: { event: cs4, of: smoking, before: 36500d, after: 36500d }
  visit_in_obs:              # R5: a visit inside an observation period (cohort-end upper bound)
    during: { event: any_visit, opens: obs_period_start, closes: obs_period_end, closed: left }

trigger: visit_in_obs        # every visit, restricted to inside an observation period

windows:
  at_risk_entry:             # #6: CS1 U CS3, OR >=2 CS4, OR a smoking-corroborated CS4
    start: null
    end: trigger
    start_inclusive: True
    end_inclusive: True
    index_timestamp: end
    has_any:
      - { cs13: (1, None) }
      - { cs4: (2, None) }
      - { cs4_smk: (1, None) }

  no_prior_ami:              # first-AMI semantics: no prior ENCOUNTER-AMI before the trigger
    start: null
    end: trigger
    start_inclusive: True
    end_inclusive: False
    has: { ami_encounter: (None, 0) }

  sufficient_history:        # R4: >=2yr of observation before the trigger (earliest obs_start)
    start: null
    end: trigger - 730d
    start_inclusive: True
    end_inclusive: True
    has: { obs_period_start: (1, None) }

  recent_activity:           # #9: >=1 condition/drug in the prior 2yr
    start: end - 730d
    end: trigger
    start_inclusive: True
    end_inclusive: True
    has: { condition_or_drug: (1, None) }

  target:                    # #2 outcome: an encounter-AMI within the next year
    start: trigger
    end: start + 365d
    start_inclusive: False
    end_inclusive: True
    label: ami_encounter

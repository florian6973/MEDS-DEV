# MIMIC-IV predicates for ami_2 (operational AMI cohort). Source-code scheme
# (DIAGNOSIS//ICD//{9,10}//<code-no-dots>); diagnosis sets are PREFIX-pruned from icd_codes.json
# (his event_check is `code.startswith`, so parent stubs like I25 / 438 cover their children).
# Regenerate with validation/aces/build_predicates.py.
#
# NOTE on ed_only_discharge: the reAIM benchmark's ED prediction points are transfers.outtime where
# hadm_id is null (non-admitted ED). The standard MIMIC->MEDS build emits NO event for them, so the
# predicate below matches nothing and the task runs hospital-only. To make ami_2 exact, have the ETL
# emit an `ed_only_discharge` event at transfers[hadm_id null].outtime (see AMI_TASK_REPORT.md).
predicates:
  ami_at_risk:
    code: {regex: "^(DIAGNOSIS//ICD//10//A381|DIAGNOSIS//ICD//10//A3952|DIAGNOSIS//ICD//10//A3953|DIAGNOSIS//ICD//10//A5201|DIAGNOSIS//ICD//10//B2682|DIAGNOSIS//ICD//10//B3322|DIAGNOSIS//ICD//10//B5881|DIAGNOSIS//ICD//10//D8685|DIAGNOSIS//ICD//10//I010|DIAGNOSIS//ICD//10//I012|DIAGNOSIS//ICD//10//I090|DIAGNOSIS//ICD//10//I092|DIAGNOSIS//ICD//10//I20|DIAGNOSIS//ICD//10//I21|DIAGNOSIS//ICD//10//I22|DIAGNOSIS//ICD//10//I232|DIAGNOSIS//ICD//10//I237|DIAGNOSIS//ICD//10//I238|DIAGNOSIS//ICD//10//I24|DIAGNOSIS//ICD//10//I25|DIAGNOSIS//ICD//10//I26|DIAGNOSIS//ICD//10//I2782|DIAGNOSIS//ICD//10//I30|DIAGNOSIS//ICD//10//I310|DIAGNOSIS//ICD//10//I311|DIAGNOSIS//ICD//10//I32|DIAGNOSIS//ICD//10//I40|DIAGNOSIS//ICD//10//I41|DIAGNOSIS//ICD//10//I514|DIAGNOSIS//ICD//10//I5181|DIAGNOSIS//ICD//10//I69|DIAGNOSIS//ICD//10//I710|DIAGNOSIS//ICD//10//I711|DIAGNOSIS//ICD//10//I712|DIAGNOSIS//ICD//10//I713|DIAGNOSIS//ICD//10//I714|DIAGNOSIS//ICD//10//I715|DIAGNOSIS//ICD//10//I716|DIAGNOSIS//ICD//10//I718|DIAGNOSIS//ICD//10//I719|DIAGNOSIS//ICD//10//I790|DIAGNOSIS//ICD//10//I970|DIAGNOSIS//ICD//10//J1082|DIAGNOSIS//ICD//10//J1182|DIAGNOSIS//ICD//10//J930|DIAGNOSIS//ICD//10//M4642|DIAGNOSIS//ICD//10//M50|DIAGNOSIS//ICD//10//P294|DIAGNOSIS//ICD//10//Q2543|DIAGNOSIS//ICD//10//S130|DIAGNOSIS//ICD//9//03282|DIAGNOSIS//ICD//9//03641|DIAGNOSIS//ICD//9//03643|DIAGNOSIS//ICD//9//07423|DIAGNOSIS//ICD//9//0930|DIAGNOSIS//ICD//9//09381|DIAGNOSIS//ICD//9//09382|DIAGNOSIS//ICD//9//09883|DIAGNOSIS//ICD//9//1303|DIAGNOSIS//ICD//9//3910|DIAGNOSIS//ICD//9//3912|DIAGNOSIS//ICD//9//393|DIAGNOSIS//ICD//9//3980|DIAGNOSIS//ICD//9//410|DIAGNOSIS//ICD//9//4111|DIAGNOSIS//ICD//9//413|DIAGNOSIS//ICD//9//414|DIAGNOSIS//ICD//9//4151|DIAGNOSIS//ICD//9//4162|DIAGNOSIS//ICD//9//420|DIAGNOSIS//ICD//9//422|DIAGNOSIS//ICD//9//4231|DIAGNOSIS//ICD//9//4232|DIAGNOSIS//ICD//9//4290|DIAGNOSIS//ICD//9//4297|DIAGNOSIS//ICD//9//42983|DIAGNOSIS//ICD//9//438|DIAGNOSIS//ICD//9//441|DIAGNOSIS//ICD//9//5120|DIAGNOSIS//ICD//9//67300|DIAGNOSIS//ICD//9//67301|DIAGNOSIS//ICD//9//67302|DIAGNOSIS//ICD//9//67303|DIAGNOSIS//ICD//9//67304|DIAGNOSIS//ICD//9//6732|DIAGNOSIS//ICD//9//6733|DIAGNOSIS//ICD//9//6738|DIAGNOSIS//ICD//9//7224|DIAGNOSIS//ICD//9//72271)"}
  ami_case:
    code: {regex: "^(DIAGNOSIS//ICD//10//I21|DIAGNOSIS//ICD//10//I238|DIAGNOSIS//ICD//9//410)"}
  crf:
    code: {regex: "^(DIAGNOSIS//ICD//10//E08|DIAGNOSIS//ICD//10//E09|DIAGNOSIS//ICD//10//E10|DIAGNOSIS//ICD//10//E11|DIAGNOSIS//ICD//10//E13|DIAGNOSIS//ICD//10//E65|DIAGNOSIS//ICD//10//E66|DIAGNOSIS//ICD//10//E780|DIAGNOSIS//ICD//10//I10|DIAGNOSIS//ICD//10//I15|DIAGNOSIS//ICD//10//I16|DIAGNOSIS//ICD//10//M794|DIAGNOSIS//ICD//10//N262|DIAGNOSIS//ICD//10//O10|DIAGNOSIS//ICD//10//O11|DIAGNOSIS//ICD//10//O13|DIAGNOSIS//ICD//10//O14|DIAGNOSIS//ICD//10//O16|DIAGNOSIS//ICD//10//O24|DIAGNOSIS//ICD//10//O9921|DIAGNOSIS//ICD//10//P292|DIAGNOSIS//ICD//10//P702|DIAGNOSIS//ICD//10//R73|DIAGNOSIS//ICD//9//249|DIAGNOSIS//ICD//9//250|DIAGNOSIS//ICD//9//2720|DIAGNOSIS//ICD//9//27800|DIAGNOSIS//ICD//9//27801|DIAGNOSIS//ICD//9//27803|DIAGNOSIS//ICD//9//2781|DIAGNOSIS//ICD//9//401|DIAGNOSIS//ICD//9//405|DIAGNOSIS//ICD//9//642|DIAGNOSIS//ICD//9//6480|DIAGNOSIS//ICD//9//64910|DIAGNOSIS//ICD//9//64913|DIAGNOSIS//ICD//9//72931|DIAGNOSIS//ICD//9//7600|DIAGNOSIS//ICD//9//7751|DIAGNOSIS//ICD//9//V8554)"}
  hospital_discharge:
    code: {regex: "^HOSPITAL_DISCHARGE"}
  # never-matches on the standard build (no event emitted for non-admitted ED); see header note.
  ed_only_discharge:
    code: {regex: "^ed_only_discharge"}
  # every code prefix in this build EXCEPT MEDS_BIRTH = the reference's "any non-birth event"
  # (observation_start is the first match). polars regex has no negative lookahead, so enumerated.
  clinical_event:
    code: {regex: "^(BMI|Blood Pressure|DIAGNOSIS|DRG|ED_OUT|ED_REGISTRATION|GENDER|HCPCS|HOSPITAL_ADMISSION|HOSPITAL_DISCHARGE|Height|ICU_ADMISSION|ICU_DISCHARGE|INFUSION_END|INFUSION_START|LAB|MEDICATION|MEDS_DEATH|PROCEDURE|SUBJECT_FLUID_OUTPUT|SUBJECT_WEIGHT_AT_INFUSION|TRANSFER_TO|Weight|eGFR)"}

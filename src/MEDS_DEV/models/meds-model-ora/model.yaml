metadata:
  description: ORA (marked time-to-event, loss_type=mtpp_shared), evaluated by linear probing on frozen representations.
  links:
    - https://github.com/florian6973/meds-model-ora
  contacts:
    - name: Florent Pollet
      email: ffp2106@cumc.columbia.edu
commands:
  unsupervised:
    train: |-
      meds-model preprocess_data external_meds_dir={dataset_dir} external_predicates_file={predicates_path} output_data_dir={output_dir}/data demo={demo} do_overwrite=true
      meds-model pretrain input_data_dir={output_dir}/data output_pretrained_model_dir={output_dir}/pretrained demo={demo} do_overwrite=true
  supervised:
    train: |-
      meds-model infer input_data_dir={model_initialization_dir}/data input_pretrained_model_dir={model_initialization_dir}/pretrained external_labels_dir={labels_dir} output_inference_subdir=inference/embeddings demo={demo} do_overwrite=true
      meds-model supervised_train input_data_dir={model_initialization_dir}/data external_labels_dir={labels_dir} input_inference_subdir=inference/embeddings output_supervised_model_dir={output_dir}/model demo={demo} do_overwrite=true
    predict:
      meds-model predict input_supervised_model_dir={model_initialization_dir}/model external_labels_dir={labels_dir}
      splits=[{split}] demo={demo} output_predictions_dir={output_dir} do_overwrite=true

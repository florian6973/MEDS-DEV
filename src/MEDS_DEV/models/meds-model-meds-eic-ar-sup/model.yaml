metadata:
  description: "MEDS-EIC-AR with the pretraining stage removed: an ablation isolating what pretraining contributes."
  links:
    - https://github.com/florian6973/meds-model-meds-eic-ar-sup
  contacts:
    - name: Florent Pollet
      email: ffp2106@cumc.columbia.edu
commands:
  supervised:
    train: |-
      meds-model preprocess_data external_meds_dir={dataset_dir} output_data_dir={output_dir}/data do_demo={demo} do_overwrite=true
      meds-model supervised_train input_data_dir={output_dir}/data external_labels_dir={labels_dir} output_supervised_model_dir={output_dir}/model do_demo={demo} do_overwrite=true
    predict:
      meds-model predict input_supervised_model_dir={model_initialization_dir}/model input_data_dir={model_initialization_dir}/data
      external_labels_dir={labels_dir} splits=[{split}] output_predictions_dir={output_dir}/predictions do_demo={demo}
      do_overwrite=true

metadata:
  description:
    MOTOR pretrained with florian6973/femr_chao_meds_v3 @ 5adf7c6 (the `ora` package, loss_type=motor),
    then FULL supervised finetuning of the encoder with a two-class head. The finetuning path is ported from
    that repository's parent's `original` branch @ 9697ce7e, which the public `main` does not carry.
  links:
    - https://github.com/florian6973/meds-model-motor-ft
  contacts:
    - name: Florent Pollet
      email: ffp2106@cumc.columbia.edu
commands:
  unsupervised:
    train: |-
      meds-model preprocess_data external_meds_dir={dataset_dir} output_data_dir={output_dir}/data demo={demo} do_overwrite=true
      meds-model pretrain input_data_dir={output_dir}/data output_pretrained_model_dir={output_dir}/pretrained demo={demo} do_overwrite=true
  supervised:
    train:
      meds-model supervised_train input_data_dir={model_initialization_dir}/data input_pretrained_model_dir={model_initialization_dir}/pretrained
      external_labels_dir={labels_dir} output_supervised_model_dir={output_dir}/model demo={demo} do_overwrite=true
    predict:
      meds-model predict input_supervised_model_dir={model_initialization_dir}/model external_labels_dir={labels_dir}
      splits=[{split}] demo={demo} output_predictions_dir={output_dir} do_overwrite=true
